name: Publish to Confluence

on:
  push:
    branches:
      - master
    paths:
      - 'docs/publish/**'
      - '.github/workflows/publish.yml'

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Publish Markdown to Confluence
        uses: markdown-confluence/publish-action@2a0af177d3d2eb33faf816a23f0316f093dcde80 # v6.0.0; retain the previously working v1 API
        with:
          atlassianApiToken: ${{ secrets.ATLASSIAN_API_TOKEN }}
          configFile: ./docs/publish/.markdown-confluence.json
