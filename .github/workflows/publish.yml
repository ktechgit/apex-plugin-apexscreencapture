name: Publish to Confluence

on:
  push:
    branches:
      - master
    paths:
      - 'docs/publish/**'
      - '.github/workflows/publish.yml'

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Publish Markdown to Confluence
        uses: markdown-confluence/publish-action@7710a0f79367aca135b8c892a7b717eac1a4c848 # v7.0.0
        with:
          atlassianApiToken: ${{ secrets.ATLASSIAN_API_TOKEN }}
          configFile: ./docs/publish/.markdown-confluence.json
